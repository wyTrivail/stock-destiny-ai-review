<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Daily Brief</title><style>
:root{--bg:#0b1020;--card:#141a2e;--text:#eef2ff;--muted:#9aa6c3;--accent:#f0c674;--warn:#fbbf24;--bad:#fb7185;--ok:#86efac;--line:#243049;--sky:#7dd3fc}
*{box-sizing:border-box}body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:linear-gradient(180deg,#0b1020,#121933 40%,#0b1020);color:var(--text);line-height:1.55}
a{color:var(--accent)}header,main{max-width:920px;margin:0 auto;padding:24px 20px}
h1{font-size:1.55rem;margin:0 0 8px}p.lead{color:var(--muted);margin:0 0 16px}
nav{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
nav a{background:#1a2340;border:1px solid var(--line);padding:8px 12px;border-radius:10px;text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
.kicker{color:var(--accent);font-size:.78rem;letter-spacing:.06em;margin:0 0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.action{font-size:1.45rem;font-weight:700;color:var(--accent);margin:6px 0 0}
.meta{color:var(--muted);font-size:.92rem}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;margin-right:6px;background:#243049}
.band-high{color:var(--bad)}.band-elevated{color:var(--warn)}.band-neutral{color:var(--sky)}.band-low{color:var(--ok)}
.changed{display:inline-block;background:rgba(251,191,36,.15);color:#fcd34d;border-radius:6px;padding:2px 8px;font-size:.75rem;font-weight:600}
.titem{border-left:3px solid var(--accent);padding:0 0 0 12px;margin:0 0 12px}
.note{color:var(--muted);font-size:.9rem}
ul{margin:8px 0 0 18px}li{margin:4px 0}
pre{white-space:pre-wrap;word-break:break-word;background:#0d1428;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:.8rem;overflow:auto}
</style></head><body>
<header>
  <h1>Daily Brief</h1>
  <p class="lead">首页简报语义。</p>
  <nav><a href="./index.html">总览</a><a href="./amd.html">AMD</a><a href="./brief.html">Brief</a><a href="./hot.html">Hot</a></nav>
</header>
<main>
  <section class="card">
    <p class="kicker">今天怎么做</p>
    <p class="action" style="font-size:1.2rem">风险最高 TTD：建议减仓。 值得盯着 ZBRA：值得盯着，等回调再说。</p>
    <p class="note" style="margin-top:10px">整体情绪偏暖，波动偏大的票变多了；今天先管风险，盯着的票先别急着买。</p>
  </section>
  <div class="grid">
    <section class="card"><p class="kicker">风险最高</p><p class="action" style="font-size:1.2rem">TTD</p><p>建议减仓</p></section>
    <section class="card"><p class="kicker">值得盯着</p><p class="action" style="font-size:1.2rem">ZBRA</p><p>值得盯着，等回调再说</p></section>
  </div>
  <section class="card"><p class="kicker">发生了什么</p><p>市场偏暖但并非无条件进攻：先标出强弱，等待回踩或结构确认再动手。</p></section>
</main></body></html>
